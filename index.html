<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اقرا الجمل</title>

<style>
:root {
  --cream:#FFEFD2;
  --teal:#6AB0AF;
  --coral:#F5A89A;
  --yellow:#FFF2A5;
  --pink:#FA699E;
  --light-pink:#FF9FC7;
  --pale-pink:#FFE7F0;
  --green:#4ADD82;
  --dark:#426B6A;
}

* { box-sizing:border-box; }

body {
  margin:0;
  font-family:Tahoma, sans-serif;
  background:var(--cream);
  color:var(--dark);
  min-height:100vh;
  overflow-x:hidden;
}

header {
  text-align:center;
  padding:18px;
}

.logo {
  width:120px;
  height:75px;
  object-fit:contain;
}

main {
  min-height:570px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
  padding:25px 15px;
}

.intro {
  text-align:center;
  margin-bottom:38px;
  z-index:1;
}

.intro h1 {
  font-size:clamp(28px,5vw,42px);
  margin:0 0 12px;
}

.intro p {
  color:#789594;
  font-size:16px;
  margin:0;
}

/* الزخارف */

.decoration {
  position:absolute;
  border-radius:50%;
  pointer-events:none;
}

.d1 {
  width:75px;height:75px;
  background:var(--pink);
  top:15%;right:10%;
}

.d2 {
  width:55px;height:55px;
  background:var(--green);
  bottom:15%;left:10%;
}

.d3 {
  width:35px;height:35px;
  background:var(--yellow);
  top:28%;left:15%;
}

.d4 {
  width:45px;height:45px;
  background:var(--coral);
  bottom:20%;right:12%;
}

/* صندوق الهدايا المرسوم */

.gift-button {
  width:280px;
  height:280px;
  border:8px solid white;
  border-radius:40px;
  background:var(--teal);
  box-shadow:0 12px 0 #438F8E, 0 20px 35px #0002;
  cursor:pointer;
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  transition:.25s;
  animation:float 3s ease-in-out infinite;
  z-index:2;
}

.gift-button:hover {
  transform:translateY(-8px) rotate(-2deg);
}

.gift-button:active {
  transform:scale(.94);
}

.gift-art {
  width:145px;
  height:115px;
  position:relative;
  margin-top:35px;
}

.gift-body {
  position:absolute;
  width:130px;
  height:95px;
  bottom:0;
  left:7px;
  background:var(--pink);
  border-radius:12px;
  box-shadow:0 7px 0 #D94D82;
}

.gift-body::before {
  content:"";
  position:absolute;
  width:24px;
  height:100%;
  background:var(--yellow);
  left:50%;
  transform:translateX(-50%);
}

.gift-lid {
  position:absolute;
  width:150px;
  height:25px;
  background:var(--coral);
  border-radius:9px;
  left:-3px;
  top:10px;
  z-index:2;
}

.gift-bow {
  position:absolute;
  top:-22px;
  left:48px;
  width:28px;
  height:25px;
  border:9px solid var(--yellow);
  border-radius:50%;
  transform:rotate(-30deg);
  z-index:3;
}

.gift-bow::after {
  content:"";
  position:absolute;
  width:28px;
  height:25px;
  border:9px solid var(--yellow);
  border-radius:50%;
  left:22px;
  top:-8px;
  transform:rotate(60deg);
}

.gift-label {
  color:white;
  font-size:21px;
  font-weight:bold;
  margin-top:35px;
}

.gift-subtitle {
  color:#E9FFFF;
  font-size:13px;
  margin-top:8px;
}

@keyframes float {
  0%,100% { transform:translateY(0); }
  50% { transform:translateY(-9px); }
}

/* البطاقات المكتشفة */

.discovered {
  width:min(950px,94%);
  margin:0 auto 45px;
  padding:25px;
  background:#ffffffa6;
  border:3px solid white;
  border-radius:28px;
  text-align:center;
}

.discovered h2 {
  margin:0 0 20px;
  font-size:23px;
}

.cards-row {
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:13px;
}

.history-card {
  width:110px;
  min-height:115px;
  border:3px solid var(--pale-pink);
  background:white;
  border-radius:19px;
  padding:9px;
  cursor:pointer;
  transition:.2s;
  box-shadow:0 5px 0 #f5d4e1;
}

.history-card:hover {
  transform:translateY(-5px);
  border-color:var(--pink);
}

.history-card img {
  width:75px;
  height:65px;
  object-fit:contain;
}

.history-card p {
  margin:5px 0 0;
  font-size:12px;
  font-weight:bold;
}

.empty-message {
  color:#8BA3A2;
  font-size:14px;
}

/* البطاقة التعليمية */

.modal {
  display:none;
  position:fixed;
  inset:0;
  background:#345959ad;
  z-index:10;
  align-items:center;
  justify-content:center;
  padding:14px;
}

.modal.show { display:flex; }

.learning-card {
  width:min(650px,100%);
  max-height:92vh;
  overflow-y:auto;
  background:white;
  border:7px solid var(--yellow);
  border-radius:30px;
  padding:22px;
  position:relative;
  text-align:center;
  animation:pop .3s ease;
}

@keyframes pop {
  from { transform:scale(.85);opacity:0; }
  to { transform:scale(1);opacity:1; }
}

.close {
  position:absolute;
  top:10px;
  left:12px;
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:var(--pale-pink);
  color:var(--dark);
  font-size:24px;
  cursor:pointer;
}

.card-number {
  display:inline-block;
  background:var(--light-pink);
  color:white;
  border-radius:20px;
  padding:8px 18px;
  font-weight:bold;
  margin-top:18px;
}

.picture {
  width:100%;
  height:220px;
  object-fit:contain;
  border-radius:20px;
  background:#FFF9EF;
  margin-top:16px;
}

/* صور الكلمات والكلمات أسفلها */

.words-title {
  font-size:18px;
  margin:24px 0 13px;
}

.words-grid {
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:12px;
}

.word-card {
  width:105px;
  min-height:120px;
  padding:10px 7px;
  border:2px solid var(--pale-pink);
  border-radius:18px;
  background:#FFF9FC;
  cursor:pointer;
  transition:.2s;
}

.word-card:nth-child(3n+2) {
  background:#F1FFFF;
  border-color:#C9E8E7;
}

.word-card:nth-child(3n) {
  background:#FFFBE8;
  border-color:#F8E9A5;
}

.word-card:hover {
  transform:translateY(-4px);
  border-color:var(--pink);
}

.word-card img {
  width:75px;
  height:65px;
  object-fit:contain;
  display:block;
  margin:auto;
}

.word-card .no-image {
  width:75px;
  height:65px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
  color:var(--coral);
}

.word-card span {
  display:block;
  direction:ltr;
  font-size:16px;
  font-weight:bold;
  margin-top:7px;
  color:var(--dark);
}

/* الجملة داخل مربعات */

.sentence-title {
  font-size:18px;
  margin:27px 0 13px;
}

.sentence-box {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
  direction:ltr;
  padding:15px;
  border-radius:20px;
  background:#FFF8E8;
}

.sentence-word {
  background:white;
  border:2px solid var(--yellow);
  border-radius:12px;
  padding:11px 14px;
  font-size:18px;
  font-weight:bold;
  color:var(--dark);
  cursor:pointer;
}

.sentence-word:hover {
  background:var(--pale-pink);
  border-color:var(--pink);
}

.translation {
  background:#F0FAF8;
  border:2px solid #CBE8E4;
  border-radius:17px;
  padding:14px;
  margin-top:14px;
  font-size:17px;
  color:var(--dark);
}

.listen {
  background:var(--pink);
  color:white;
  border:0;
  border-radius:18px;
  padding:13px 25px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin-top:17px;
  box-shadow:0 5px 0 #D94D82;
}

.listen:active {
  transform:translateY(4px);
  box-shadow:none;
}

@media(max-width:500px) {
  .gift-button {
    width:245px;
    height:245px;
  }

  .learning-card {
    padding:15px;
  }

  .picture {
    height:175px;
  }

  .word-card {
    width:90px;
  }

  .word-card img,
  .word-card .no-image {
    width:65px;
    height:58px;
  }
}
</style>
</head>

<body>

<header>
  <img class="logo" src="IMG_3829.png" alt="رِواق">
</header>

<main>
  <div class="decoration d1"></div>
  <div class="decoration d2"></div>
  <div class="decoration d3"></div>
  <div class="decoration d4"></div>

  <div class="intro">
    <h1>يلا نكتشف!</h1>
    <p>اضغط على الصندوق واكتشف كلمات وجمل جديدة</p>
  </div>

  <button class="gift-button" onclick="openNextCard()">
    <div class="gift-art">
      <div class="gift-bow"></div>
      <div class="gift-lid"></div>
      <div class="gift-body"></div>
    </div>
    <span class="gift-label">افتح واكتشف</span>
    <span class="gift-subtitle">ماذا يوجد بالداخل؟</span>
  </button>
</main>

<section class="discovered">
  <h2>بطاقاتي المكتشفة</h2>
  <div class="cards-row" id="history">
    <p class="empty-message">اكتشف أول بطاقة لتظهر هنا</p>
  </div>
</section>

<div class="modal" id="modal" onclick="closeOutside(event)">
  <div class="learning-card">

    <button class="close" onclick="closeCard()">×</button>

    <div class="card-number" id="cardNumber"></div>

    <!-- الصورة الرئيسية -->
    <img id="cardImage" class="picture" src="" alt="الصورة الرئيسية">

    <!-- صور الكلمات والكلمات -->
    <h3 class="words-title">نتعلم الكلمات</h3>
    <div class="words-grid" id="wordsGrid"></div>

    <!-- الجملة -->
    <h3 class="sentence-title">الجملة كاملة</h3>
    <div class="sentence-box" id="sentenceBox"></div>

    <div class="translation" id="translation"></div>

    <button class="listen" onclick="speakSentence()">
      استمع للجملة
    </button>

  </div>
</div>

<script>

/*
  أضيفي محتوى كل بطاقة هنا.

  words:
  image = صورة الكلمة
  word = الكلمة الإنجليزية

  sentence = الجملة الإنجليزية
  translation = الترجمة العربية
*/

const imageFiles = [
"IMG_4409.jpeg",
"IMG_4410.jpeg",
"IMG_4411.jpeg",
"IMG_4412.jpeg",
"IMG_4413.jpeg",
"IMG_4414.jpeg",
"IMG_4415.jpeg",
"IMG_4416.jpeg",
"IMG_4417.jpeg",
"IMG_4418.jpeg",
"IMG_4419.jpeg",
"IMG_4420.jpeg",
"IMG_4421.jpeg",
"IMG_4422.jpeg",
"IMG_4423.jpeg",
"IMG_4424.jpeg",
"IMG_4425.jpeg",
"IMG_4426.jpeg",
"IMG_4427.jpeg",
"IMG_4428.jpeg",
"IMG_4429.jpeg",
"IMG_4430.jpeg",
"IMG_4431.jpeg",
"IMG_4432.jpeg",
"IMG_4433.jpeg",
"IMG_4434.jpeg",
"IMG_4435.jpeg",
"IMG_4436.jpeg",
"IMG_4437.jpeg",
"IMG_4438.jpeg",
"IMG_4439.jpeg"
];

const learningCards = imageFiles.map((image,index) => ({
  id:index+1,
  image:image,
  sentence:"",
  translation:"",
  words:[
    // مثال لإضافة الكلمات:
    // { word:"Apple", image:"apple.jpeg" },
    // { word:"Red", image:"red.jpeg" }
  ]
}));

let discovered = [];
let nextIndex = 0;
let currentCard = null;

/* فتح البطاقة التالية */

function openNextCard() {

  if(discovered.length === learningCards.length) {
    discovered = [];
    nextIndex = 0;
    renderHistory();
  }

  while(
    nextIndex < learningCards.length &&
    discovered.includes(learningCards[nextIndex].id)
  ) {
    nextIndex++;
  }

  if(nextIndex >= learningCards.length) {
    nextIndex = 0;
  }

  showCard(learningCards[nextIndex]);
  nextIndex++;
}

/* عرض البطاقة */

function showCard(card) {

  currentCard = card;

  document.getElementById("cardNumber").textContent =
    "البطاقة " + card.id;

  document.getElementById("cardImage").src = card.image;

  /* عرض الكلمات */

  const wordsGrid = document.getElementById("wordsGrid");
  wordsGrid.innerHTML = "";

  card.words.forEach(item => {

    const box = document.createElement("button");
    box.className = "word-card";

    if(item.image) {
      const img = document.createElement("img");
      img.src = item.image;
      img.alt = item.word;
      box.appendChild(img);
    } else {
      const placeholder = document.createElement("div");
      placeholder.className = "no-image";
      placeholder.textContent = "＋";
      box.appendChild(placeholder);
    }

    const word = document.createElement("span");
    word.textContent = item.word;

    box.appendChild(word);

    box.onclick = () => speak(item.word);

    wordsGrid.appendChild(box);
  });

  /* عرض الجملة في مربعات منفصلة */

  const sentenceBox = document.getElementById("sentenceBox");
  sentenceBox.innerHTML = "";

  if(card.sentence.trim()) {

    card.sentence.trim().split(/\s+/).forEach(word => {

      const wordBox = document.createElement("button");
      wordBox.className = "sentence-word";
      wordBox.textContent = word;

      wordBox.onclick = () => speak(word);

      sentenceBox.appendChild(wordBox);
    });

  } else {
    sentenceBox.textContent = "ستضاف الجملة هنا";
  }

  document.getElementById("translation").textContent =
    card.translation || "ستضاف الترجمة العربية هنا";

  document.getElementById("modal").classList.add("show");

  if(!discovered.includes(card.id)) {
    discovered.push(card.id);
    renderHistory();
  }
}

/* الصوت */

function speak(text) {

  if(!text) return;

  window.speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(text);
  speech.lang = "en-US";
  speech.rate = 0.85;

  window.speechSynthesis.speak(speech);
}

function speakSentence() {
  if(currentCard) {
    speak(currentCard.sentence);
  }
}

/* إغلاق البطاقة */

function closeCard() {
  document.getElementById("modal").classList.remove("show");
  window.speechSynthesis.cancel();
}

function closeOutside(event) {
  if(event.target.id === "modal") {
    closeCard();
  }
}

/* البطاقات المكتشفة */

function renderHistory() {

  const history = document.getElementById("history");
  history.innerHTML = "";

  if(discovered.length === 0) {
    history.innerHTML =
      '<p class="empty-message">اكتشف أول بطاقة لتظهر هنا</p>';
    return;
  }

  discovered.forEach(id => {

    const card = learningCards.find(item => item.id === id);

    const button = document.createElement("button");
    button.className = "history-card";

    const img = document.createElement("img");
    img.src = card.image;
    img.alt = "";

    const label = document.createElement("p");
    label.textContent = "بطاقة " + id;

    button.appendChild(img);
    button.appendChild(label);

    button.onclick = () => showCard(card);

    history.appendChild(button);
  });
}

</script>

</body>
</html>
