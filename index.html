<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>كتاب نماء التفاعلي</title>

<style>
:root {
  --cream:#FFEFD2;
  --teal:#6AB0AF;
  --coral:#F5A89A;
  --yellow:#FFF2A5;
  --pink:#FA699E;
  --light-pink:#FF9FC7;
  --pale-pink:#FFE7F0;
  --green:#4ADD82;
  --dark:#426B6A;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  min-height:100vh;
  font-family:Tahoma,sans-serif;
  color:var(--dark);
  background:
    radial-gradient(circle at 10% 15%,#fff 0 3px,transparent 4px),
    radial-gradient(circle at 85% 25%,#fff 0 4px,transparent 5px),
    linear-gradient(180deg,#DDF5F2 0%,#FFF0D5 65%,#FFE3D9 100%);
  overflow-x:hidden;
}

/* الشعار */

header {
  text-align:center;
  padding:8px;
  position:relative;
  z-index:3;
}

.logo {
  width:125px;
  height:75px;
  object-fit:contain;
}

/* خلفية طفولية */

.background-decor {
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:0;
}

.cloud {
  position:absolute;
  width:115px;
  height:38px;
  background:white;
  border-radius:50px;
  opacity:.8;
}

.cloud::before,
.cloud::after {
  content:"";
  position:absolute;
  background:white;
  border-radius:50%;
}

.cloud::before {
  width:48px;
  height:48px;
  top:-23px;
  left:20px;
}

.cloud::after {
  width:60px;
  height:60px;
  top:-32px;
  right:18px;
}

.cloud.one {
  top:17%;
  left:5%;
}

.cloud.two {
  top:35%;
  right:4%;
  transform:scale(.8);
}

.cloud.three {
  bottom:14%;
  left:13%;
  transform:scale(.7);
}

.star {
  position:absolute;
  font-size:27px;
  animation:twinkle 3s infinite ease-in-out;
}

.star.one { top:20%; right:20%; color:#F5C94A; }
.star.two { top:45%; left:7%; color:#FA699E; }
.star.three { bottom:18%; right:13%; color:#6AB0AF; }
.star.four { top:12%; left:25%; color:#FA699E; }

@keyframes twinkle {
  0%,100% { transform:scale(1); }
  50% { transform:scale(1.3) rotate(15deg); }
}

.ground {
  position:fixed;
  bottom:-70px;
  left:-5%;
  width:110%;
  height:150px;
  background:#BDE8C9;
  border-radius:50% 50% 0 0;
  z-index:0;
}

/* العنوان */

.intro {
  text-align:center;
  position:relative;
  z-index:2;
  margin:0 10px 15px;
}

.intro h1 {
  margin:0 0 7px;
  font-size:clamp(23px,4vw,34px);
  color:#438F8E;
}

.intro p {
  margin:0;
  color:#789594;
  font-size:14px;
}

/* منطقة الكتاب */

.book-area {
  width:100%;
  min-height:calc(100vh - 140px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:12px 15px 35px;
  position:relative;
  z-index:2;
}

/* الكتاب */

.book {
  width:min(1050px,96vw);
  height:min(660px,72vh);
  min-height:480px;
  position:relative;
  perspective:1800px;
  filter:drop-shadow(0 17px 13px #547b702e);
}

/* الغلاف */

.cover {
  position:absolute;
  inset:0;
  z-index:50;
  border:9px solid white;
  border-radius:24px 35px 35px 24px;
  background:linear-gradient(135deg,#72C4BE,#438F8E);
  box-shadow:inset -10px 0 #397D7C;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  cursor:pointer;
  transform-origin:right center;
  transition:transform 1s ease,opacity .7s ease;
  overflow:hidden;
}

.cover::before {
  content:"";
  position:absolute;
  inset:17px;
  border:3px solid #ffffffa8;
  border-radius:15px 25px 25px 15px;
}

.cover.open {
  transform:rotateY(-110deg);
  opacity:0;
  pointer-events:none;
}

.cover-art {
  font-size:75px;
  margin-bottom:15px;
}

.cover h2 {
  color:white;
  font-size:clamp(32px,5vw,48px);
  margin:5px;
  position:relative;
}

.cover p {
  color:white;
  font-size:17px;
  position:relative;
}

.cover-button {
  border:0;
  border-radius:20px;
  background:var(--yellow);
  color:var(--dark);
  padding:15px 32px;
  font-size:18px;
  font-weight:bold;
  margin-top:25px;
  cursor:pointer;
  box-shadow:0 6px 0 #D6C56E;
  position:relative;
}

/* صفحات الكتاب */

.spread {
  position:absolute;
  inset:0;
  display:grid;
  grid-template-columns:1fr 1fr;
  direction:ltr;
  background:#E8D5B5;
  border:9px solid #C7A77D;
  border-radius:15px 24px 24px 15px;
  box-shadow:inset 0 0 15px #0002;
  overflow:hidden;
}

/* خط منتصف الكتاب */

.spread::after {
  content:"";
  position:absolute;
  top:0;
  bottom:0;
  left:50%;
  width:15px;
  transform:translateX(-50%);
  background:linear-gradient(90deg,#C8B18D,#F5EAD5,#C8B18D);
  z-index:4;
  pointer-events:none;
}

/* كل صفحة */

.book-page {
  background:#FFFEF8;
  min-width:0;
  height:100%;
  padding:22px;
  overflow-y:auto;
  direction:rtl;
  position:relative;
}

.image-page {
  border-left:2px solid #E7DCC8;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:
    linear-gradient(135deg,#FFFDF4,#FFF8E9);
}

.content-page {
  background:#FFFEF8;
}

/* إطار الصورة */

.picture-frame {
  width:100%;
  height:90%;
  min-height:250px;
  background:white;
  border:5px solid white;
  border-radius:22px;
  box-shadow:0 5px 18px #0002;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

.main-picture {
  width:100%;
  height:100%;
  object-fit:contain;
}

.image-caption {
  margin-top:10px;
  font-size:18px;
  color:#79A5A1;
  font-weight:bold;
}

/* رقم الصفحة */

.page-number {
  display:inline-block;
  background:var(--light-pink);
  color:white;
  border-radius:20px;
  padding:7px 17px;
  font-weight:bold;
  margin-bottom:15px;
}

/* الكلمات */

.section-title {
  font-size:19px;
  margin:8px 0 13px;
  color:#438F8E;
}

.words-grid {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
}

.word-card {
  min-width:0;
  min-height:105px;
  padding:8px 4px;
  border:2px solid var(--pale-pink);
  border-radius:16px;
  background:#FFF7FB;
  cursor:pointer;
  transition:.2s;
}

.word-card:nth-child(3n+2) {
  background:#F0FAF9;
  border-color:#C9E8E7;
}

.word-card:nth-child(3n) {
  background:#FFFBE8;
  border-color:#F8E9A5;
}

.word-card:hover {
  transform:translateY(-4px);
  border-color:var(--pink);
}

.word-card img,
.word-placeholder {
  width:65px;
  height:55px;
  object-fit:contain;
  display:block;
  margin:auto;
}

.word-placeholder {
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--coral);
  font-size:25px;
}

.word-card span {
  display:block;
  direction:ltr;
  font-size:14px;
  font-weight:bold;
  margin-top:5px;
}

/* الجملة */

.sentence-title {
  margin:20px 0 10px;
  font-size:19px;
  color:#438F8E;
}

.sentence-box {
  direction:ltr;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:7px;
  padding:13px;
  border-radius:16px;
  background:#FFF6E3;
}

.sentence-word {
  background:white;
  border:2px solid var(--yellow);
  border-radius:10px;
  padding:9px 11px;
  font-size:15px;
  font-weight:bold;
  color:var(--dark);
  cursor:pointer;
}

.sentence-word:hover {
  background:var(--pale-pink);
  border-color:var(--pink);
}

/* الترجمة */

.translation {
  background:#EFF9F7;
  border:2px solid #CBE8E4;
  border-radius:14px;
  padding:12px;
  margin-top:13px;
  font-size:16px;
  text-align:center;
}

/* زر الصوت */

.listen {
  width:100%;
  border:0;
  background:var(--pink);
  color:white;
  border-radius:15px;
  padding:12px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin-top:13px;
  box-shadow:0 4px 0 #D94D82;
}

/* التنقل */

.controls {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:20px;
  margin-top:18px;
}

.nav-button {
  width:48px;
  height:48px;
  border:0;
  border-radius:50%;
  background:var(--pink);
  color:white;
  font-size:25px;
  cursor:pointer;
  box-shadow:0 5px 0 #D94D82;
}

.nav-button:disabled {
  opacity:.35;
  cursor:not-allowed;
}

.counter {
  background:white;
  border:2px solid var(--yellow);
  border-radius:18px;
  padding:10px 18px;
  direction:ltr;
  font-weight:bold;
}

.back-button {
  display:none;
  border:0;
  background:var(--teal);
  color:white;
  border-radius:15px;
  padding:11px 22px;
  margin-top:15px;
  font-size:15px;
  cursor:pointer;
}

.back-button.show {
  display:block;
}

/* الجوال */

@media(max-width:650px) {

  .book {
    height:680px;
    min-height:0;
    max-height:none;
    width:96vw;
  }

  .book-page {
    padding:12px 8px;
  }

  .spread {
    border-width:6px;
  }

  .spread::after {
    width:8px;
  }

  .picture-frame {
    height:75%;
    min-height:190px;
    border-width:4px;
  }

  .image-caption {
    font-size:14px;
  }

  .section-title,
  .sentence-title {
    font-size:15px;
  }

  .words-grid {
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:6px;
  }

  .word-card {
    min-height:85px;
  }

  .word-card img,
  .word-placeholder {
    width:45px;
    height:42px;
  }

  .word-card span {
    font-size:12px;
  }

  .sentence-word {
    font-size:12px;
    padding:7px;
  }

  .translation {
    font-size:13px;
  }

  .listen {
    font-size:13px;
  }
}

@media(max-width:380px) {
  .book {
    height:620px;
  }

  .book-page {
    padding:9px 5px;
  }

  .word-card {
    min-height:78px;
  }
}
</style>
</head>

<body>

<!-- خلفية اللعبة -->

<div class="background-decor">
  <div class="cloud one"></div>
  <div class="cloud two"></div>
  <div class="cloud three"></div>

  <div class="star one">★</div>
  <div class="star two">✦</div>
  <div class="star three">★</div>
  <div class="star four">✦</div>

  <div class="ground"></div>
</div>

<!-- الشعار -->

<header>
  <img src="IMG_3829.png" class="logo" alt="شعار نماء">
</header>

<div class="intro">
  <h1>مغامرة نماء التعليمية!</h1>
  <p>افتح الكتاب واكتشف عالم الكلمات والجمل</p>
</div>

<main class="book-area">

  <div class="book">

    <!-- الغلاف -->

    <div class="cover" id="cover" onclick="openBook()">
      <div class="cover-art">📖</div>
      <h2>كتاب نماء</h2>
      <p>رحلتنا الممتعة لتعلم اللغة الإنجليزية</p>
      <button class="cover-button">هيا نبدأ!</button>
    </div>

    <!-- صفحتا الكتاب -->

    <div class="spread">

      <!-- صفحة الصورة -->

      <section class="book-page image-page">

        <div class="page-number" id="imagePageNumber">
          الصفحة 1
        </div>

        <div class="picture-frame">
          <img
            class="main-picture"
            id="mainPicture"
            src="IMG_4409.jpeg"
            alt="الصورة التعليمية"
          >
        </div>

        <div class="image-caption">
          شاهد الصورة واكتشف!
        </div>

      </section>

      <!-- صفحة الكلمات والجملة -->

      <section class="book-page content-page">

        <div class="page-number" id="contentPageNumber">
          الصفحة 1
        </div>

        <h3 class="section-title">نتعلم الكلمات</h3>

        <div class="words-grid" id="wordsGrid"></div>

        <h3 class="sentence-title">اقرأ الجملة</h3>

        <div class="sentence-box" id="sentenceBox"></div>

        <div class="translation" id="translation">
          ستضاف الترجمة العربية هنا
        </div>

        <button class="listen" onclick="speakSentence()">
          🔊 استمع للجملة
        </button>

      </section>

    </div>

  </div>

  <!-- أزرار التقليب -->

  <div class="controls">

    <button class="nav-button" id="nextBtn" onclick="nextPage()">
      ❮
    </button>

    <div class="counter" id="counter">
      1 / 31
    </div>

    <button class="nav-button" id="prevBtn" onclick="prevPage()">
      ❯
    </button>

  </div>

  <button class="back-button" id="backButton" onclick="closeBook()">
    العودة إلى الغلاف
  </button>

</main>

<script>

/*
================================================
بيانات صفحات الكتاب

كل عنصر يمثل صفحتين متقابلتين:
الصورة في صفحة، والكلمات والجملة في الصفحة الأخرى.

أضيفي الجمل والكلمات لكل صورة بشكل مستقل.
================================================
*/

const learningCards = [

  {id:1,image:"IMG_4409.jpeg",sentence:"",translation:"",words:[]},
  {id:2,image:"IMG_4410.jpeg",sentence:"",translation:"",words:[]},
  {id:3,image:"IMG_4411.jpeg",sentence:"",translation:"",words:[]},
  {id:4,image:"IMG_4412.jpeg",sentence:"",translation:"",words:[]},
  {id:5,image:"IMG_4413.jpeg",sentence:"",translation:"",words:[]},
  {id:6,image:"IMG_4414.jpeg",sentence:"",translation:"",words:[]},
  {id:7,image:"IMG_4415.jpeg",sentence:"",translation:"",words:[]},
  {id:8,image:"IMG_4416.jpeg",sentence:"",translation:"",words:[]},
  {id:9,image:"IMG_4417.jpeg",sentence:"",translation:"",words:[]},
  {id:10,image:"IMG_4418.jpeg",sentence:"",translation:"",words:[]},
  {id:11,image:"IMG_4419.jpeg",sentence:"",translation:"",words:[]},
  {id:12,image:"IMG_4420.jpeg",sentence:"",translation:"",words:[]},
  {id:13,image:"IMG_4421.jpeg",sentence:"",translation:"",words:[]},
  {id:14,image:"IMG_4422.jpeg",sentence:"",translation:"",words:[]},
  {id:15,image:"IMG_4423.jpeg",sentence:"",translation:"",words:[]},
  {id:16,image:"IMG_4424.jpeg",sentence:"",translation:"",words:[]},
  {id:17,image:"IMG_4425.jpeg",sentence:"",translation:"",words:[]},
  {id:18,image:"IMG_4426.jpeg",sentence:"",translation:"",words:[]},
  {id:19,image:"IMG_4427.jpeg",sentence:"",translation:"",words:[]},
  {id:20,image:"IMG_4428.jpeg",sentence:"",translation:"",words:[]},
  {id:21,image:"IMG_4429.jpeg",sentence:"",translation:"",words:[]},
  {id:22,image:"IMG_4430.jpeg",sentence:"",translation:"",words:[]},
  {id:23,image:"IMG_4431.jpeg",sentence:"",translation:"",words:[]},
  {id:24,image:"IMG_4432.jpeg",sentence:"",translation:"",words:[]},
  {id:25,image:"IMG_4433.jpeg",sentence:"",translation:"",words:[]},
  {id:26,image:"IMG_4434.jpeg",sentence:"",translation:"",words:[]},
  {id:27,image:"IMG_4435.jpeg",sentence:"",translation:"",words:[]},
  {id:28,image:"IMG_4436.jpeg",sentence:"",translation:"",words:[]},
  {id:29,image:"IMG_4437.jpeg",sentence:"",translation:"",words:[]},
  {id:30,image:"IMG_4438.jpeg",sentence:"",translation:"",words:[]},
  {id:31,image:"IMG_4439.jpeg",sentence:"",translation:"",words:[]}

];

let currentPage = 0;
let bookOpened = false;


/* عرض الصفحة الحالية */

function showPage() {

  const card = learningCards[currentPage];

  document.getElementById("mainPicture").src = card.image;

  document.getElementById("imagePageNumber").textContent =
    "الصفحة " + card.id;

  document.getElementById("contentPageNumber").textContent =
    "الصفحة " + card.id;

  document.getElementById("counter").textContent =
    (currentPage + 1) + " / " + learningCards.length;

  document.getElementById("nextBtn").disabled =
    currentPage === learningCards.length - 1;

  document.getElementById("prevBtn").disabled =
    currentPage === 0;

  renderWords(card);

  renderSentence(card);

  document.getElementById("translation").textContent =
    card.translation || "ستضاف الترجمة العربية هنا";

}


/* عرض الكلمات */

function renderWords(card) {

  const grid = document.getElementById("wordsGrid");

  grid.innerHTML = "";

  if(card.words.length === 0) {

    grid.innerHTML =
      '<p style="font-size:13px;color:#8BA3A2">ستضاف الكلمات هنا</p>';

    return;

  }

  card.words.forEach(item => {

    const button = document.createElement("button");

    button.className = "word-card";

    if(item.image) {

      const img = document.createElement("img");

      img.src = item.image;

      img.alt = item.word;

      button.appendChild(img);

    } else {

      const placeholder = document.createElement("div");

      placeholder.className = "word-placeholder";

      placeholder.textContent = "＋";

      button.appendChild(placeholder);

    }

    const word = document.createElement("span");

    word.textContent = item.word;

    button.appendChild(word);

    button.onclick = () => speak(item.word);

    grid.appendChild(button);

  });

}


/* عرض الجملة */

function renderSentence(card) {

  const box = document.getElementById("sentenceBox");

  box.innerHTML = "";

  if(!card.sentence.trim()) {

    box.textContent = "ستضاف الجملة هنا";

    return;

  }

  card.sentence.trim().split(/\s+/).forEach(word => {

    const button = document.createElement("button");

    button.className = "sentence-word";

    button.textContent = word;

    button.onclick = () => speak(word);

    box.appendChild(button);

  });

}


/* فتح الكتاب */

function openBook() {

  bookOpened = true;

  document.getElementById("cover").classList.add("open");

  document.getElementById("backButton").classList.add("show");

  showPage();

}


/* الصفحة التالية */

function nextPage() {

  if(!bookOpened) return;

  if(currentPage < learningCards.length - 1) {

    currentPage++;

    showPage();

  }

}


/* الصفحة السابقة */

function prevPage() {

  if(!bookOpened) return;

  if(currentPage > 0) {

    currentPage--;

    showPage();

  }

}


/* العودة للغلاف */

function closeBook() {

  bookOpened = false;

  currentPage = 0;

  window.speechSynthesis.cancel();

  document.getElementById("cover").classList.remove("open");

  document.getElementById("backButton").classList.remove("show");

  showPage();

}


/* الصوت */

function speak(text) {

  if(!text) return;

  window.speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(text);

  speech.lang = "en-US";

  speech.rate = 0.85;

  window.speechSynthesis.speak(speech);

}


/* الاستماع للجملة */

function speakSentence() {

  const card = learningCards[currentPage];

  if(card && card.sentence) {

    speak(card.sentence);

  }

}


/* تشغيل أول صفحة */

showPage();

</script>

</body>
</html>
