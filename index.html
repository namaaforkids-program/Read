<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>كتاب  نماء - اقرأ وتعلم</title>

<style>
:root {
  --cream:#FFEFD2;
  --teal:#6AB0AF;
  --coral:#F5A89A;
  --yellow:#FFF2A5;
  --pink:#FA699E;
  --light-pink:#FF9FC7;
  --pale-pink:#FFE7F0;
  --green:#4ADD82;
  --dark:#426B6A;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  min-height:100vh;
  font-family:Tahoma,sans-serif;
  background:var(--cream);
  color:var(--dark);
  overflow-x:hidden;
}

header {
  text-align:center;
  padding:14px;
}

.logo {
  width:130px;
  height:80px;
  object-fit:contain;
}

.intro {
  text-align:center;
  padding:8px 15px 20px;
}

.intro h1 {
  font-size:clamp(25px,5vw,38px);
  margin:5px 0 10px;
}

.intro p {
  color:#789594;
  font-size:15px;
}

/* خلفية الكتاب */

.book-area {
  min-height:550px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:25px 12px 45px;
  position:relative;
  overflow:hidden;
}

.decoration {
  position:absolute;
  border-radius:50%;
  pointer-events:none;
}

.d1 {
  width:65px;
  height:65px;
  background:var(--pink);
  top:15%;
  right:7%;
}

.d2 {
  width:50px;
  height:50px;
  background:var(--green);
  bottom:15%;
  left:8%;
}

.d3 {
  width:35px;
  height:35px;
  background:var(--yellow);
  top:28%;
  left:13%;
}

.d4 {
  width:45px;
  height:45px;
  background:var(--coral);
  bottom:20%;
  right:10%;
}

/* حاوية الكتاب */

.book {
  width:min(440px,90vw);
  height:560px;
  max-height:72vh;
  min-height:420px;
  position:relative;
  perspective:1800px;
  z-index:2;
}

/* غلاف الكتاب */

.cover {
  position:absolute;
  inset:0;
  z-index:50;
  border-radius:18px 28px 28px 18px;
  background:linear-gradient(140deg,#75C4BE,#438F8E);
  border:8px solid white;
  box-shadow:
    12px 12px 0 #397D7C,
    18px 20px 30px #0002;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  cursor:pointer;
  transition:transform 1s ease,opacity .8s ease;
  transform-origin:right center;
  overflow:hidden;
}

.cover.open {
  transform:rotateY(-115deg);
  opacity:0;
  pointer-events:none;
}

.cover::before {
  content:"";
  position:absolute;
  inset:15px;
  border:3px solid #ffffffa8;
  border-radius:12px 20px 20px 12px;
}

.cover-decoration {
  font-size:45px;
  margin-bottom:18px;
}

.cover h2 {
  color:white;
  font-size:35px;
  margin:10px 0;
  position:relative;
}

.cover p {
  color:white;
  font-size:16px;
  position:relative;
}

.cover-button {
  margin-top:30px;
  background:var(--yellow);
  color:var(--dark);
  border:0;
  border-radius:18px;
  padding:14px 28px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 5px 0 #D6C56E;
  position:relative;
}

.cover-button:active {
  transform:translateY(4px);
  box-shadow:none;
}

/* صفحات الكتاب */

.pages {
  position:absolute;
  inset:0;
  background:#E9D7B7;
  border-radius:12px 20px 20px 12px;
  box-shadow:8px 8px 0 #CBB995;
  transform-style:preserve-3d;
}

.page {
  position:absolute;
  inset:0;
  background:white;
  border:5px solid #F3E6CE;
  border-radius:10px 18px 18px 10px;
  transform-origin:right center;
  transform-style:preserve-3d;
  backface-visibility:hidden;
  transition:transform .8s ease;
  overflow:hidden;
  padding:22px;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

.page.flipped {
  transform:rotateY(-180deg);
}

.page-content {
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  overflow-y:auto;
  padding:5px;
}

.page-number {
  background:var(--light-pink);
  color:white;
  padding:8px 18px;
  border-radius:20px;
  font-weight:bold;
  margin-bottom:12px;
  flex-shrink:0;
}

.main-picture {
  width:100%;
  height:180px;
  object-fit:contain;
  background:#FFF9EF;
  border-radius:18px;
  margin-bottom:12px;
  flex-shrink:0;
}

/* الكلمات */

.words-title {
  font-size:17px;
  margin:10px 0;
}

.words-grid {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:9px;
  width:100%;
}

.word-card {
  width:85px;
  min-height:100px;
  padding:7px;
  border:2px solid var(--pale-pink);
  border-radius:15px;
  background:#FFF9FC;
  cursor:pointer;
}

.word-card:nth-child(3n+2) {
  background:#F1FFFF;
  border-color:#C9E8E7;
}

.word-card:nth-child(3n) {
  background:#FFFBE8;
  border-color:#F8E9A5;
}

.word-card img {
  width:60px;
  height:55px;
  object-fit:contain;
}

.word-card span {
  display:block;
  direction:ltr;
  font-size:14px;
  font-weight:bold;
  margin-top:5px;
}

.no-image {
  height:55px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  color:var(--coral);
}

/* الجملة */

.sentence-title {
  font-size:17px;
  margin:18px 0 10px;
}

.sentence-box {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:7px;
  direction:ltr;
  background:#FFF8E8;
  border-radius:15px;
  padding:12px;
  width:100%;
}

.sentence-word {
  background:white;
  border:2px solid var(--yellow);
  border-radius:10px;
  padding:8px 10px;
  font-size:15px;
  font-weight:bold;
  color:var(--dark);
  cursor:pointer;
}

.translation {
  width:100%;
  background:#F0FAF8;
  border:2px solid #CBE8E4;
  border-radius:14px;
  padding:12px;
  margin-top:12px;
  font-size:15px;
}

/* أزرار الصوت */

.listen {
  background:var(--pink);
  color:white;
  border:0;
  border-radius:15px;
  padding:11px 22px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  margin:12px 0;
  box-shadow:0 4px 0 #D94D82;
  flex-shrink:0;
}

/* أزرار التنقل */

.controls {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:22px;
  margin-top:25px;
  z-index:3;
}

.nav-button {
  width:48px;
  height:48px;
  border:0;
  border-radius:50%;
  background:var(--pink);
  color:white;
  font-size:27px;
  cursor:pointer;
  box-shadow:0 5px 0 #D94D82;
}

.nav-button:disabled {
  opacity:.35;
  cursor:not-allowed;
}

.counter {
  background:white;
  border:2px solid var(--yellow);
  padding:10px 20px;
  border-radius:20px;
  font-weight:bold;
  direction:ltr;
}

.back-button {
  display:none;
  margin-top:20px;
  border:0;
  border-radius:15px;
  background:var(--teal);
  color:white;
  padding:11px 22px;
  font-size:15px;
  cursor:pointer;
}

.back-button.show {
  display:block;
}

@media(max-width:500px) {
  .book {
    width:92vw;
    height:550px;
    max-height:70vh;
    min-height:410px;
  }

  .page {
    padding:13px;
  }

  .main-picture {
    height:145px;
  }

  .word-card {
    width:75px;
    min-height:90px;
  }

  .word-card img {
    width:52px;
    height:48px;
  }
}
</style>
</head>

<body>

<!-- الشعار -->
<header>
  <img class="logo" src="IMG_3829.png" alt="شعار رِواق">
</header>

<div class="intro">
  <h1>رحلتنا مع الكلمات!</h1>
  <p>افتح كتاب رِواق واكتشف جملة جديدة في كل صفحة</p>
</div>

<main class="book-area">

  <div class="decoration d1"></div>
  <div class="decoration d2"></div>
  <div class="decoration d3"></div>
  <div class="decoration d4"></div>

  <div class="book">

    <!-- غلاف الكتاب -->
    <div class="cover" id="cover" onclick="openBook()">

      <div class="cover-decoration">✿</div>

      <h2>كتاب رِواق</h2>

      <p>نتعلم الكلمات ونقرأ الجمل</p>

      <button class="cover-button">
        افتح الكتاب
      </button>

    </div>

    <!-- الصفحات -->
    <div class="pages" id="pages"></div>

  </div>

  <!-- التنقل -->
  <div class="controls">

    <button class="nav-button"
      id="nextBtn"
      onclick="nextPage()">
      ❯
    </button>

    <div class="counter" id="counter">
      0 / 31
    </div>

    <button class="nav-button"
      id="prevBtn"
      onclick="prevPage()">
      ❮
    </button>

  </div>

  <button class="back-button" id="backButton" onclick="closeBook()">
    العودة إلى الغلاف
  </button>

</main>

<script>

/*
================================================
محتوى الكتاب

كل صورة صفحة مستقلة.

image       = الصورة الرئيسية
sentence    = الجملة الإنجليزية
translation = الترجمة العربية
words       = صور الكلمات والكلمات الإنجليزية

يمكنك إضافة المحتوى لكل صفحة بشكل مستقل.
================================================
*/

const learningCards = [

  { id:1, image:"IMG_4409.jpeg", sentence:"", translation:"", words:[] },
  { id:2, image:"IMG_4410.jpeg", sentence:"", translation:"", words:[] },
  { id:3, image:"IMG_4411.jpeg", sentence:"", translation:"", words:[] },
  { id:4, image:"IMG_4412.jpeg", sentence:"", translation:"", words:[] },
  { id:5, image:"IMG_4413.jpeg", sentence:"", translation:"", words:[] },
  { id:6, image:"IMG_4414.jpeg", sentence:"", translation:"", words:[] },
  { id:7, image:"IMG_4415.jpeg", sentence:"", translation:"", words:[] },
  { id:8, image:"IMG_4416.jpeg", sentence:"", translation:"", words:[] },
  { id:9, image:"IMG_4417.jpeg", sentence:"", translation:"", words:[] },
  { id:10, image:"IMG_4418.jpeg", sentence:"", translation:"", words:[] },
  { id:11, image:"IMG_4419.jpeg", sentence:"", translation:"", words:[] },
  { id:12, image:"IMG_4420.jpeg", sentence:"", translation:"", words:[] },
  { id:13, image:"IMG_4421.jpeg", sentence:"", translation:"", words:[] },
  { id:14, image:"IMG_4422.jpeg", sentence:"", translation:"", words:[] },
  { id:15, image:"IMG_4423.jpeg", sentence:"", translation:"", words:[] },
  { id:16, image:"IMG_4424.jpeg", sentence:"", translation:"", words:[] },
  { id:17, image:"IMG_4425.jpeg", sentence:"", translation:"", words:[] },
  { id:18, image:"IMG_4426.jpeg", sentence:"", translation:"", words:[] },
  { id:19, image:"IMG_4427.jpeg", sentence:"", translation:"", words:[] },
  { id:20, image:"IMG_4428.jpeg", sentence:"", translation:"", words:[] },
  { id:21, image:"IMG_4429.jpeg", sentence:"", translation:"", words:[] },
  { id:22, image:"IMG_4430.jpeg", sentence:"", translation:"", words:[] },
  { id:23, image:"IMG_4431.jpeg", sentence:"", translation:"", words:[] },
  { id:24, image:"IMG_4432.jpeg", sentence:"", translation:"", words:[] },
  { id:25, image:"IMG_4433.jpeg", sentence:"", translation:"", words:[] },
  { id:26, image:"IMG_4434.jpeg", sentence:"", translation:"", words:[] },
  { id:27, image:"IMG_4435.jpeg", sentence:"", translation:"", words:[] },
  { id:28, image:"IMG_4436.jpeg", sentence:"", translation:"", words:[] },
  { id:29, image:"IMG_4437.jpeg", sentence:"", translation:"", words:[] },
  { id:30, image:"IMG_4438.jpeg", sentence:"", translation:"", words:[] },
  { id:31, image:"IMG_4439.jpeg", sentence:"", translation:"", words:[] }

];


/* حالة الكتاب */

let currentPage = 0;
let bookOpened = false;


/* إنشاء الصفحات */

function createPages() {

  const pages = document.getElementById("pages");

  pages.innerHTML = "";

  learningCards.forEach((card,index) => {

    const page = document.createElement("div");

    page.className = "page";

    page.style.zIndex = learningCards.length - index;

    page.innerHTML = `
      <div class="page-content">

        <div class="page-number">
          الصفحة ${card.id}
        </div>

        <img
          class="main-picture"
          src="${card.image}"
          alt="الصورة الرئيسية"
        >

        <h3 class="words-title">نتعلم الكلمات</h3>

        <div class="words-grid" id="words-${card.id}"></div>

        <h3 class="sentence-title">الجملة كاملة</h3>

        <div class="sentence-box" id="sentence-${card.id}"></div>

        <div class="translation" id="translation-${card.id}"></div>

        <button class="listen" onclick="speakSentence(${card.id})">
          🔊 استمع للجملة
        </button>

      </div>
    `;

    pages.appendChild(page);

    renderCardContent(card);

  });

}


/* إضافة الكلمات والجمل */

function renderCardContent(card) {

  const wordsGrid =
    document.getElementById("words-" + card.id);

  const sentenceBox =
    document.getElementById("sentence-" + card.id);

  const translation =
    document.getElementById("translation-" + card.id);


  /* الكلمات */

  if(card.words.length === 0) {

    wordsGrid.innerHTML =
      '<p>ستضاف الكلمات هنا</p>';

  } else {

    card.words.forEach(item => {

      const button = document.createElement("button");

      button.className = "word-card";

      if(item.image) {

        const img = document.createElement("img");

        img.src = item.image;

        img.alt = item.word;

        button.appendChild(img);

      } else {

        const placeholder = document.createElement("div");

        placeholder.className = "no-image";

        placeholder.textContent = "＋";

        button.appendChild(placeholder);

      }

      const word = document.createElement("span");

      word.textContent = item.word;

      button.appendChild(word);

      button.onclick = () => speak(item.word);

      wordsGrid.appendChild(button);

    });

  }


  /* الجملة */

  if(card.sentence.trim()) {

    card.sentence.trim().split(/\s+/).forEach(word => {

      const button = document.createElement("button");

      button.className = "sentence-word";

      button.textContent = word;

      button.onclick = () => speak(word);

      sentenceBox.appendChild(button);

    });

  } else {

    sentenceBox.textContent = "ستضاف الجملة هنا";

  }


  /* الترجمة */

  translation.textContent =
    card.translation || "ستضاف الترجمة العربية هنا";

}


/* فتح الكتاب */

function openBook() {

  bookOpened = true;

  document.getElementById("cover").classList.add("open");

  document.getElementById("backButton").classList.add("show");

  updateBook();

}


/* الصفحة التالية */

function nextPage() {

  if(!bookOpened) return;

  if(currentPage < learningCards.length) {

    currentPage++;

    updateBook();

  }

}


/* الصفحة السابقة */

function prevPage() {

  if(!bookOpened) return;

  if(currentPage > 0) {

    currentPage--;

    updateBook();

  }

}


/* تحديث الصفحات */

function updateBook() {

  const pages = document.querySelectorAll(".page");

  pages.forEach((page,index) => {

    const flipped = index < currentPage;

    page.classList.toggle("flipped",flipped);

    page.style.zIndex = flipped
      ? index + 1
      : learningCards.length - index + 1;

  });

  document.getElementById("counter").textContent =
    currentPage + " / " + learningCards.length;

  document.getElementById("nextBtn").disabled =
    currentPage >= learningCards.length;

  document.getElementById("prevBtn").disabled =
    currentPage === 0;

}


/* العودة إلى الغلاف */

function closeBook() {

  currentPage = 0;

  bookOpened = false;

  window.speechSynthesis.cancel();

  document.getElementById("cover").classList.remove("open");

  document.getElementById("backButton").classList.remove("show");

  updateBook();

}


/* الصوت */

function speak(text) {

  if(!text) return;

  window.speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(text);

  speech.lang = "en-US";

  speech.rate = 0.85;

  window.speechSynthesis.speak(speech);

}


/* الاستماع للجملة كاملة */

function speakSentence(id) {

  const card = learningCards.find(item => item.id === id);

  if(card) {

    speak(card.sentence);

  }

}


/* تشغيل الكتاب */

createPages();

updateBook();

</script>

</body>
</html>
