<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رِواق</title>

<style>
:root {
  --cream: #FFEFD2;
  --teal: #6AB0AF;
  --coral: #F5A89A;
  --yellow: #FFF2A5;
  --pink: #FA699E;
  --light-pink: #FF9FC7;
  --pale-pink: #FFE7F0;
  --green: #4ADD82;
  --dark: #426B6A;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: "Trebuchet MS", Tahoma, sans-serif;
  background:
    radial-gradient(circle at 10% 15%, #ffffff 0 5px, transparent 6px),
    radial-gradient(circle at 90% 30%, #ffffff 0 6px, transparent 7px),
    var(--cream);
  color: var(--dark);
  overflow-x: hidden;
}

/* Header */

header {
  display: flex;
  justify-content: center;
  padding: 18px 15px 5px;
}

.logo {
  width: 115px;
  height: 75px;
  object-fit: contain;
}

/* Main */

main {
  min-height: 570px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  position: relative;
  padding: 25px 15px;
  overflow: hidden;
}

.intro {
  text-align: center;
  margin-bottom: 35px;
  z-index: 2;
}

.intro h1 {
  font-size: clamp(28px, 5vw, 42px);
  color: var(--dark);
  margin: 0 0 12px;
  font-weight: 900;
}

.intro p {
  color: #779594;
  font-size: 17px;
  margin: 0;
}

/* Decorations */

.shape {
  position: absolute;
  pointer-events: none;
  z-index: 0;
}

.circle-pink {
  width: 75px;
  height: 75px;
  border-radius: 50%;
  background: var(--pink);
  top: 18%;
  right: 9%;
  opacity: .8;
}

.circle-green {
  width: 55px;
  height: 55px;
  border-radius: 50%;
  background: var(--green);
  bottom: 15%;
  left: 10%;
}

.circle-yellow {
  width: 35px;
  height: 35px;
  border-radius: 50%;
  background: var(--yellow);
  top: 30%;
  left: 16%;
}

.flower {
  font-size: 38px;
  color: var(--coral);
  top: 12%;
  left: 9%;
}

.star {
  font-size: 40px;
  color: var(--pink);
  bottom: 18%;
  right: 12%;
}

/* Main gift */

.gift-button {
  width: min(280px, 72vw);
  height: 280px;
  border: 9px solid white;
  border-radius: 42px;
  background: var(--teal);
  box-shadow:
    0 12px 0 #438F8E,
    0 20px 35px #537c7c30;
  cursor: pointer;
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  transition: transform .25s;
  animation: float 3s ease-in-out infinite;
}

.gift-button:hover {
  transform: translateY(-8px) rotate(-2deg);
}

.gift-button:active {
  transform: scale(.94);
}

.gift-box {
  width: 130px;
  height: 105px;
  background: var(--pink);
  border-radius: 13px;
  position: relative;
  margin-top: 20px;
  box-shadow: 0 7px 0 #d94d82;
}

.gift-box::before {
  content: "";
  position: absolute;
  width: 23px;
  height: 100%;
  background: var(--yellow);
  left: 50%;
  transform: translateX(-50%);
}

.gift-box::after {
  content: "";
  position: absolute;
  width: 150px;
  height: 24px;
  background: var(--coral);
  border-radius: 9px;
  top: -15px;
  left: -10px;
}

.ribbon {
  position: absolute;
  width: 42px;
  height: 30px;
  border: 9px solid var(--yellow);
  border-radius: 50%;
  top: -42px;
  left: 20px;
  transform: rotate(-25deg);
}

.ribbon::after {
  content: "";
  position: absolute;
  width: 42px;
  height: 30px;
  border: 9px solid var(--yellow);
  border-radius: 50%;
  left: 28px;
  top: -9px;
  transform: rotate(50deg);
}

.gift-label {
  color: white;
  font-size: 22px;
  font-weight: bold;
  margin-top: 35px;
}

.gift-subtitle {
  color: #E8FFFF;
  font-size: 13px;
  margin-top: 8px;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-9px); }
}

/* Discovered cards */

.discovered {
  width: min(950px, 94%);
  margin: 0 auto 55px;
  padding: 25px;
  background: #ffffff8c;
  border-radius: 30px;
  border: 3px solid white;
  text-align: center;
}

.discovered h2 {
  font-size: 24px;
  margin: 0 0 20px;
}

.cards-row {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 14px;
}

.history-card {
  width: 115px;
  min-height: 120px;
  background: white;
  border: 3px solid var(--pale-pink);
  border-radius: 20px;
  padding: 10px;
  cursor: pointer;
  transition: .2s;
  box-shadow: 0 5px 0 #f5d4e1;
}

.history-card:hover {
  transform: translateY(-6px);
  border-color: var(--pink);
}

.history-card img {
  width: 75px;
  height: 65px;
  object-fit: contain;
  border-radius: 10px;
}

.history-card p {
  font-size: 13px;
  font-weight: bold;
  margin: 7px 0 0;
}

.empty-message {
  color: #8BA3A2;
  font-size: 15px;
}

/* Learning card */

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: #345959a8;
  z-index: 10;
  align-items: center;
  justify-content: center;
  padding: 15px;
}

.modal.show {
  display: flex;
}

.learning-card {
  width: min(520px, 100%);
  background: white;
  border: 7px solid var(--yellow);
  border-radius: 32px;
  padding: 25px;
  position: relative;
  text-align: center;
  box-shadow: 0 15px 40px #00000025;
  animation: pop .3s ease;
}

@keyframes pop {
  from {
    transform: scale(.8);
    opacity: 0;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}

.close {
  position: absolute;
  top: 12px;
  left: 13px;
  width: 39px;
  height: 39px;
  border: 0;
  border-radius: 50%;
  background: var(--pale-pink);
  color: var(--dark);
  font-size: 25px;
  cursor: pointer;
}

.card-number {
  background: var(--light-pink);
  color: white;
  display: inline-block;
  padding: 7px 18px;
  border-radius: 20px;
  font-weight: bold;
  margin-top: 25px;
}

.picture {
  width: 100%;
  height: 220px;
  object-fit: contain;
  border-radius: 20px;
  background: #FFF9EF;
  margin-top: 15px;
}

.english {
  direction: ltr;
  font-size: 25px;
  font-weight: bold;
  color: var(--dark);
  margin: 20px 0 10px;
}

.arabic {
  font-size: 19px;
  color: #849D9C;
  margin: 0 0 20px;
}

.listen {
  background: var(--pink);
  color: white;
  border: 0;
  border-radius: 18px;
  padding: 14px 27px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 5px 0 #D94D82;
  transition: .2s;
}

.listen:hover {
  background: #e9538c;
}

.listen:active {
  transform: translateY(4px);
  box-shadow: none;
}

.listen:disabled {
  opacity: .5;
  cursor: not-allowed;
}

/* Responsive */

@media(max-width: 500px) {
  main {
    min-height: 520px;
  }

  .gift-button {
    width: 245px;
    height: 245px;
  }

  .gift-box {
    transform: scale(.85);
  }

  .learning-card {
    padding: 17px;
  }

  .picture {
    height: 175px;
  }

  .english {
    font-size: 22px;
  }

  .discovered {
    padding: 18px 10px;
  }
}
</style>
</head>

<body>

<header>
  <img class="logo" src="IMG_3829.png" alt="رِواق">
</header>

<main>

  <div class="shape circle-pink"></div>
  <div class="shape circle-green"></div>
  <div class="shape circle-yellow"></div>
  <div class="shape flower">✿</div>
  <div class="shape star">✦</div>

  <div class="intro">
    <h1>يلا نكتشف!</h1>
    <p>كل ضغطة تخبّي لنا جملة جديدة</p>
  </div>

  <button class="gift-button" onclick="openNextCard()">
    <div class="gift-box">
      <div class="ribbon"></div>
    </div>
    <span class="gift-label">افتح واكتشف</span>
    <span class="gift-subtitle">وش راح تكتشف اليوم؟</span>
  </button>

</main>

<section class="discovered">
  <h2>بطاقاتي المكتشفة</h2>
  <div class="cards-row" id="history">
    <p class="empty-message">
      البطاقات المكتشفة بتظهر هنا
    </p>
  </div>
</section>

<div class="modal" id="modal" onclick="closeOutside(event)">

  <div class="learning-card">

    <button class="close" onclick="closeCard()">×</button>

    <div class="card-number" id="cardNumber"></div>

    <img id="cardImage" class="picture" src="" alt="صورة البطاقة">

    <p class="english" id="englishText"></p>

    <p class="arabic" id="arabicText"></p>

    <button class="listen" id="listenButton" onclick="speakSentence()">
      استمع للجملة
    </button>

  </div>
</div>

<script>

/* الصور التعليمية */

const imageFiles = [
  "IMG_4409.jpeg",
  "IMG_4410.jpeg",
  "IMG_4411.jpeg",
  "IMG_4412.jpeg",
  "IMG_4413.jpeg",
  "IMG_4414.jpeg",
  "IMG_4415.jpeg",
  "IMG_4416.jpeg",
  "IMG_4417.jpeg",
  "IMG_4418.jpeg",
  "IMG_4419.jpeg",
  "IMG_4420.jpeg",
  "IMG_4421.jpeg",
  "IMG_4422.jpeg",
  "IMG_4423.jpeg",
  "IMG_4424.jpeg",
  "IMG_4425.jpeg",
  "IMG_4426.jpeg",
  "IMG_4427.jpeg",
  "IMG_4428.jpeg",
  "IMG_4429.jpeg",
  "IMG_4430.jpeg",
  "IMG_4431.jpeg",
  "IMG_4432.jpeg",
  "IMG_4433.jpeg",
  "IMG_4434.jpeg",
  "IMG_4435.jpeg",
  "IMG_4436.jpeg",
  "IMG_4437.jpeg",
  "IMG_4438.jpeg",
  "IMG_4439.jpeg"
];

/*
  أضيفي الجمل والترجمات داخل القائمة لاحقًا.
  اتركيها فارغة إذا لم تجهزي الجملة بعد.
*/

const learningCards = imageFiles.map((image, index) => ({
  id: index + 1,
  image: image,
  english: "",
  arabic: ""
}));

let discovered = [];
let currentCard = null;
let nextIndex = 0;

/* فتح البطاقة التالية */

function openNextCard() {

  if (discovered.length === learningCards.length) {
    discovered = [];
    nextIndex = 0;
    renderHistory();
  }

  while (
    nextIndex < learningCards.length &&
    discovered.includes(learningCards[nextIndex].id)
  ) {
    nextIndex++;
  }

  if (nextIndex >= learningCards.length) {
    nextIndex = 0;
  }

  const card = learningCards[nextIndex];

  nextIndex++;

  showCard(card);
}

/* عرض البطاقة */

function showCard(card) {

  currentCard = card;

  document.getElementById("cardImage").src = card.image;

  document.getElementById("cardNumber").textContent =
    "البطاقة " + card.id;

  document.getElementById("englishText").textContent =
    card.english;

  document.getElementById("arabicText").textContent =
    card.arabic;

  document.getElementById("listenButton").disabled =
    !card.english.trim();

  document.getElementById("modal").classList.add("show");

  if (!discovered.includes(card.id)) {
    discovered.push(card.id);
    renderHistory();
  }
}

/* إغلاق البطاقة */

function closeCard() {

  document.getElementById("modal").classList.remove("show");

  window.speechSynthesis.cancel();
}

function closeOutside(event) {

  if (event.target.id === "modal") {
    closeCard();
  }
}

/* تشغيل الصوت */

function speakSentence() {

  if (!currentCard || !currentCard.english.trim()) {
    return;
  }

  window.speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(
    currentCard.english
  );

  speech.lang = "en-US";
  speech.rate = 0.85;

  window.speechSynthesis.speak(speech);
}

/* عرض البطاقات المكتشفة */

function renderHistory() {

  const history = document.getElementById("history");

  history.innerHTML = "";

  if (discovered.length === 0) {

    history.innerHTML =
      '<p class="empty-message">البطاقات المكتشفة بتظهر هنا</p>';

    return;
  }

  discovered.forEach(id => {

    const card = learningCards.find(item => item.id === id);

    const button = document.createElement("button");
    button.className = "history-card";

    const img = document.createElement("img");
    img.src = card.image;
    img.alt = "البطاقة " + id;

    const label = document.createElement("p");
    label.textContent = "بطاقة " + id;

    button.appendChild(img);
    button.appendChild(label);

    button.onclick = () => showCard(card);

    history.appendChild(button);

  });
}

</script>

</body>
</html>
